<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- 像素画框：品牌橙赤陶色系，呼应站点画廊主题 -->
  <!-- 框体 -->
  <rect x="2" y="2" width="12" height="12" fill="#8a4129"/>
  <!-- 画布 -->
  <rect x="4" y="4" width="8" height="8" fill="#faece3"/>
  <!-- 太阳 -->
  <rect x="9" y="5" width="2" height="2" fill="#e29a78"/>
  <!-- 大山 -->
  <rect x="6" y="8" width="1" height="1" fill="#c25e3c"/>
  <rect x="5" y="9" width="3" height="1" fill="#c25e3c"/>
  <rect x="4" y="10" width="4" height="2" fill="#c25e3c"/>
  <!-- 小山 -->
  <rect x="10" y="9" width="1" height="1" fill="#d97757"/>
  <rect x="9" y="10" width="3" height="2" fill="#d97757"/>
  <!-- 挂钉 -->
  <rect x="7" y="0" width="2" height="1" fill="#8a4129"/>
</svg>
