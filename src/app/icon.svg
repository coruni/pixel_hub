<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges">
  <!-- 参考 public/seed/pixel.svg 的像素拼贴：深棕底 + 金/赤像素块 -->
  <rect width="16" height="16" fill="#1b150f"/>
  <!-- 左上：金赤交错棋盘 -->
  <rect x="1" y="1" width="4" height="4" fill="#e8a33d"/>
  <rect x="5" y="1" width="4" height="4" fill="#b5582a"/>
  <rect x="1" y="5" width="4" height="4" fill="#b5582a"/>
  <rect x="5" y="5" width="4" height="4" fill="#e8a33d"/>
  <!-- 右上：深棕单块 + 金块（对应原图中右组） -->
  <rect x="10" y="1" width="5" height="4" fill="#7a3a1c"/>
  <rect x="10" y="5" width="5" height="4" fill="#e8a33d"/>
  <!-- 底部：长金条 + 右段深棕 -->
  <rect x="1" y="10" width="14" height="5" fill="#e8a33d"/>
  <rect x="10" y="10" width="5" height="5" fill="#7a3a1c"/>
</svg>
